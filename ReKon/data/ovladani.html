<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovládací Panel - Kuchyň</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .box { background: #2a2a2a; padding: 25px; border-radius: 12px; max-width: 550px; margin: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #ff9800; text-align: center; font-size: 24px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #ccc; }
        select, button { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; border-radius: 8px; border: none; }
        select { background: #444; color: white; border: 1px solid #555; }
        .btn-submit { background: #4CAF50; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 18px; }
        .btn-submit:hover { background: #45a049; }
        .btn-danger { background: #d32f2f; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-mute { background: #1976D2; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .radio-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 8px; }
        .radio-group label { background: #444; padding: 12px 5px; flex: 1; text-align: center; cursor: pointer; margin: 0; border-radius: 8px; font-weight: bold; font-size: 14px; }
        input[type="radio"]:checked + label { background: #ff9800; color: #000; }
        input[type="radio"] { display: none; }
        .info { color: #888; font-size: 13px; margin-top: 15px; text-align: center; line-height: 1.4; }
        .divider { height: 1px; background: #444; margin: 25px 0; }
    </style>
</head>
<body>
<div class="box">
    <h2>Nastavení kuchyně</h2>
    <form action="/api/nastavit" method="POST">
        <label>Režim čtečky:</label>
        <div class="radio-group">
            <input type="radio" id="r_vydej" name="rezim" value="VYDEJ" checked>
            <label for="r_vydej">🍕 VÝDEJ</label>
            
            <input type="radio" id="r_hodnoceni" name="rezim" value="HODNOCENI">
            <label for="r_hodnoceni">⭐ HODNOCENÍ</label>

            <input type="radio" id="r_normal" name="rezim" value="NORMAL">
            <label for="r_normal">⚙️ NORMAL</label>
        </div>

        <label for="jidlaList">Aktuální jídlo z databáze:</label>
        <select name="jidlo_data" id="jidlaList">
            <option value="0|Nacitam|Obed">Načítám jídla z SD karty...</option>
        </select>

        <div class="info">Změna jídla nebo režimu vynuluje čítač porcí a dětská hodnocení. V režimu NORMAL čtečka funguje samostatně bez tabletu.</div>
        
        <button type="submit" class="btn-submit">ULOŽIT A VYNULOVAT</button>
    </form>
    
    <div class="divider"></div>
    <label>Servis a ovládání:</label>
    <button type="button" id="btnMute" class="btn-mute" onclick="toggleMute()">🔕 ZTLUMIT ZVUK</button>
    <button type="button" class="btn-danger" onclick="togglePorucha()">PŘEPNOUT STAV PORUCHY</button>
</div>

<div class="divider"></div>
    <h2>Nastavení displeje a zpráv</h2>
    <label for="cfgEditor">Obsah souboru display_cfg.txt:</label>
    <textarea id="cfgEditor" style="width:100%; height:180px; background:#333; color:#fff; border:1px solid #555; border-radius:8px; padding:10px; font-family:monospace; font-size:14px; box-sizing:border-box;"></textarea>
    
    <div style="font-size:12px; color:#aaa; margin-top:5px;">
        Značky: <code>{JMENO}</code>, <code>{PRIJMENI}</code>, <code>{OSLOVENI}</code>, <code>{ODDIL}</code>, <code>{ROLE}</code>, <code>{DIETA}</code>
    </div>
    
    <button type="button" class="btn-submit" onclick="saveDisplayConfig()" style="background:#0288D1; margin-top:10px;">💾 ULOŽIT ŠABLONY DISPLEJE</button>

<script>
    // Načtení stávajících šablon z SD karty do textového pole
    fetch('/api/display_cfg/get')
        .then(r => r.text())
        .then(txt => {
            document.getElementById('cfgEditor').value = txt;
        });

    function saveDisplayConfig() {
        let content = document.getElementById('cfgEditor').value;
        fetch('/api/display_cfg/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: 'cfg_content=' + encodeURIComponent(content)
        }).then(r => r.text()).then(res => {
            if(res === "OK") alert("Šablony byly úspěšně uloženy na SD kartu!");
            else alert("Chyba při ukládání: " + res);
        });
    }
</script>

<script>
    fetch('/api/seznam_jidel')
        .then(r => r.text())
        .then(html => { 
            if(html.trim() !== "") { document.getElementById('jidlaList').innerHTML = html; }
        });

    function togglePorucha() {
        fetch('/api/porucha')
            .then(r => r.text())
            .then(msg => alert("Stav čtečky změněn: " + msg));
    }

    function toggleMute() {
        fetch('/api/mute')
            .then(r => r.text())
            .then(msg => {
                let btn = document.getElementById('btnMute');
                if (msg.includes("ZTLUMENO")) {
                    btn.style.background = "#555";
                    btn.innerText = "🔊 ZAPNOUT ZVUK";
                } else {
                    btn.style.background = "#1976D2";
                    btn.innerText = "🔕 ZTLUMIT ZVUK";
                }
            });
    }
</script>
</body>
</html>
